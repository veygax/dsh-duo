# DSH Duo companion bundle. Installs one Host row; override `config` from your
# profile's cordis.patch.yml (same id) to change the relay or behavior.
- insert:
    - id: duo-remote
      name: dsh-plugin-duo-remote
      config:
        # Relay URL. Unset uses DSH_DUO_RELAY, then the public relay (see relay/README.md).
        relay: !!js process.env.DSH_DUO_RELAY
        holdQuestions: true
        historyMessages: 200
